version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: nexora-postgres
    restart: always
    environment:
      POSTGRES_DB: nexora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexorapassword
    ports:
      - "5432:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexora-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:nexorapassword@db:5432/nexora_db
      SECRET_KEY: nexora-super-secret-production-key-2026-very-secure
      AI_PROVIDER: local
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  nexora_pgdata:
